<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Coffee Troubleshooter</title>
<style>
:root{--bg:#f6f3ed;--card:#fffaf2;--ink:#1f1d1a;--muted:#6f675d;--line:#d8cfc0;--accent:#587760;--accent2:#2f4b3a;--soft:#e5efe7;--warn:#7b3e30}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:3;background:rgba(246,243,237,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px}h1{font-size:22px;margin:0 0 5px}.sub{font-size:13px;color:var(--muted);line-height:1.35;max-width:760px}
main{padding:14px;max-width:780px;margin:0 auto 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:7px;text-transform:uppercase;letter-spacing:.04em}select,input{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;color:var(--ink);font-size:16px}.grid{display:grid;gap:12px}@media(min-width:680px){.grid{grid-template-columns:1fr 1fr}}
.cluster{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;font-size:14px;color:var(--ink)}.chip.active{background:var(--accent2);color:#fff;border-color:var(--accent2);font-weight:700}.chip.strong{border-color:#a97956;background:#fff7f0}.chip.over{border-color:#a65e50;background:#fff4f2}.chip.weak{border-color:#7486a3;background:#f5f7fc}.chip.under{border-color:#a88745;background:#fff9e9}.chip.balanced{border-color:#5f8a69;background:#f1f8f1}.chip .groupTag{font-size:10px;font-weight:800;letter-spacing:.04em;margin-left:6px;opacity:.7}.chip.active .groupTag{opacity:.85}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.tab{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 10px;font-size:13px}.tab.active{background:var(--soft);border-color:#b9cfbe;font-weight:800;color:var(--accent2)}
.selbar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.clear{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px}.muted{color:var(--muted);font-size:13px;line-height:1.4}.diagnosis h2{margin:0 0 8px;font-size:19px}.pill{display:inline-block;background:#eee5d8;border:1px solid var(--line);border-radius:999px;padding:5px 9px;margin:2px 4px 2px 0;font-size:12px;color:#4c4338}.fix{border-left:4px solid var(--accent);padding:10px 12px;background:#fff;border-radius:12px;margin:9px 0}.fix b{display:block;margin-bottom:4px}.score{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}.bar{background:#eee7dc;border-radius:999px;overflow:hidden;height:9px}.fill{height:100%;background:var(--accent)}.scoreRow{display:grid;grid-template-columns:110px 1fr 30px;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>Coffee Troubleshooter</h1><div class="sub">Descriptor-driven dialing for filter coffee, Joepresso soup / zuppa lunga, Joepresso standard, and Hario Switch. Select one or more flavor/texture notes to get a diagnosis and method-specific corrections.</div></header>
<main>
<section class="card grid"><div><label>Brewing method</label><select id="method"></select></div><div><label>Search descriptors</label><input id="search" placeholder="e.g. sour, dry, thin, sticky" /></div></section>
<section class="card"><div class="selbar"><div><label>Selected descriptors</label><div id="selected" class="cluster"></div></div><button id="clear" class="clear">Clear</button></div></section>
<section class="card"><label>Descriptor groups</label><div id="tabs" class="tabs"></div><div id="chips" class="cluster"></div></section>
<section class="card diagnosis" id="diagnosis"></section>
<section class="card"><label>Method baseline</label><div id="baseline" class="muted"></div></section>
</main>
<script>
const groups={
 strong:{title:'Strong / heavy',words:['Soupy','Dull','Sticky','Heavy','Robust','Strong','Thick','Luscious','Rich','Harsh','Overwhelming','Intense']},
 over:{title:'Over-extracted',words:['Dry','Bitter','Powdery','Empty','Dusty','Astringent','Limp','Scrawny','Muted','Medicinal']},
 weak:{title:'Weak / thin',words:['Dilute','Delicate','Thin','Fragile','Faint','Slender','Sparse','Flimsy','Watery','Tea-like','Insipid','Underwhelming']},
 under:{title:'Under-extracted',words:['Quick Finish','Salty','Sour','Vegetal','Nutty','Bland']}
};
const methods={
 soup:{name:'Joepresso soup / zuppa lunga',baseline:'Likely starting point: about 16 g coffee, filter above and below the puck if using that style, room-temp pre-wet/soak, then hot-water press or bypass to a longer drink. Treat it as espresso-like extraction plus dilution, so puck prep and yield matter more than with Switch.'},
 standard:{name:'Joepresso standard',baseline:'Standard pattern: fine grind, about 14 g coffee, about 60 ml boiling water, tamped puck, short pre-infusion after first drops, then firm steady press until hiss. Adjust one variable at a time.'},
 switch:{name:'Hario Switch',baseline:'Useful starting point: 15 g / 240 g or 30 g / 480 g, valve closed for bloom or immersion phase, gentle stir/swirl, then open. For larger batches, preserve ratio first, then tune grind and steep/drain time.'},
 filter:{name:'Filter coffee',baseline:'Useful starting point: about 60 g/L, medium grind, fresh water just off boil for light/medium roasts, even bed wetting, and a total brew time around 3–5 minutes depending on brewer and batch size. Adjust ratio for strength and grind/contact time/agitation for extraction.'}
};
const actions={
 strong:{generic:['Reduce strength: use less coffee, more water, or more bypass/dilution.','If it is also harsh or drying, reduce extraction as well.'],soup:['Lower dose by 1 g or increase bypass/dilution by 15–30 g.','If texture is muddy, grind slightly coarser or reduce tamp pressure; tamping too hard can choke flow and make the cup heavy.'],standard:['Reduce dose from 14 g toward 13 g, or add a little more water after pressing.','If flow is very slow or hiss comes late, grind slightly coarser.'],switch:['Keep water fixed and reduce dose by 1–2 g, or keep dose fixed and add 20–30 g water.','Use gentler agitation if the cup is heavy and dull.'],filter:['Use a weaker ratio: reduce dose by 1–2 g per 250 g water, or add bypass water after brewing.','If the cup is also harsh or muddy, grind coarser and reduce agitation rather than only diluting.']},
 over:{generic:['Extract less: coarser grind, shorter contact time, less agitation, or slightly cooler water.'],soup:['Grind one step coarser and reduce hot press contact time.','Press more gently and check tamp pressure; tamping too hard can compact the puck, slow flow, and produce harsh/astringent flavors.'],standard:['Grind slightly coarser; aim for firm flow, not a stalled press. If the press is extremely difficult, tamping too hard is a likely contributor.','Stop at hiss; forcing after the water is through can increase harshness.'],switch:['Open the valve sooner, shorten steep time by 20–45 s, or grind coarser.','Stir/swirl less aggressively.'],filter:['Grind slightly coarser, reduce agitation, or shorten total brew time.','Avoid excessive drawdown from fines; rinse filters, pour more gently, and check grinder fines if the finish is dry or bitter.']},
 weak:{generic:['Increase strength: use more coffee, less water, or less bypass/dilution.','If weak and sour, increase extraction too.'],soup:['Increase dose by 1 g or reduce bypass/dilution by 15–30 g.','Confirm the hot-water phase is extracting through the puck, not bypassing around it.'],standard:['Increase dose toward 15 g if flow allows, or reduce final dilution.','Check for too-coarse grind, loose tamp, or uneven puck prep. Do not overcorrect by tamping harder; too-hard tamping can choke flow rather than add strength.'],switch:['Increase dose by 1–2 g at the same water amount.','If the bed is very shallow, brew a smaller batch or use a stronger ratio.'],filter:['Use a stronger ratio: add 1–2 g coffee per 250 g water, or reduce final water/bypass.','If it is weak and sour, also grind finer or improve wetting; ratio alone may not fix under-extraction.']},
 under:{generic:['Extract more: finer grind, longer contact time, better wetting, or more agitation.'],soup:['Grind finer, extend the room-temp soak, and ensure the puck is evenly wetted before the hot press.','Use a top filter to reduce channeling and distribute water.'],standard:['Grind finer and extend pre-infusion toward the longer end of your range.','Improve puck prep: level bed, even moderate tamp, no side gaps. Avoid tamping too hard; it can cause slow flow or channeling around the puck.'],switch:['Keep valve closed longer, stir gently after adding water, or grind finer.','For Ratio Six-assisted bloom behavior, hold closed through bloom, then open at the main brew phase.'],filter:['Grind finer, increase contact time, or add a slightly more active pour/agitation.','Improve wetting at the start: bloom thoroughly, break up dry pockets, and keep the bed level.']}
};
const all=Object.entries(groups).flatMap(([key,g])=>g.words.map(word=>({key,word})));const method=document.getElementById('method'),search=document.getElementById('search'),tabs=document.getElementById('tabs'),chips=document.getElementById('chips'),sel=document.getElementById('selected'),diag=document.getElementById('diagnosis'),base=document.getElementById('baseline');let active='all',selected=[];
for(const[k,m]of Object.entries(methods)){const o=document.createElement('option');o.value=k;o.textContent=m.name;method.appendChild(o)}
function norm(s){return s.toLowerCase().replace(/[^a-z]/g,'')}function isSel(w){return selected.some(x=>x.word===w)}
function toggle(item){selected=isSel(item.word)?selected.filter(x=>x.word!==item.word):[...selected,item];render()}
function renderTabs(){tabs.innerHTML='';[['all','All'],...Object.entries(groups).map(([k,g])=>[k,g.title])].forEach(([k,t])=>{const b=document.createElement('button');b.className='tab '+(active===k?'active':'');b.textContent=t;b.onclick=()=>{active=k;renderChips()};tabs.appendChild(b)})}
function renderChips(){const q=norm(search.value);chips.innerHTML='';all.filter(x=>(active==='all'||x.key===active)&&(!q||norm(x.word).includes(q))).forEach(x=>{const b=document.createElement('button');b.className='chip '+x.key+' '+(isSel(x.word)?'active':'');b.innerHTML=`${x.word}<span class="groupTag">${groups[x.key].title}</span>`;b.onclick=()=>toggle(x);chips.appendChild(b)})}
function renderSelected(){sel.innerHTML='';if(!selected.length){sel.innerHTML='<span class="muted">None selected</span>';return}selected.forEach(x=>{const b=document.createElement('button');b.className='chip active';b.textContent=x.word+' ×';b.onclick=()=>toggle(x);sel.appendChild(b)})}
function scores(){const s={strong:0,over:0,weak:0,under:0};selected.forEach(x=>s[x.key]++);return s}
function mainKey(s){const entries=Object.entries(s).sort((a,b)=>b[1]-a[1]);return entries[0][1]?entries[0][0]:null}
function comboKey(s){if(s.over&&s.strong)return 'over + strong';if(s.over&&s.weak)return 'over + weak';if(s.under&&s.weak)return 'under + weak';if(s.under&&s.strong)return 'under + strong';return null}
function renderDiag(){base.textContent=methods[method.value].baseline;if(!selected.length){diag.innerHTML='<h2>Select descriptors</h2><p class="muted">Use the search field or tap bubbles. Multiple descriptors are allowed; the diagnosis is based on the strongest pattern.</p>';return}const s=scores(),key=mainKey(s),combo=comboKey(s),m=method.value,total=selected.length,max=Math.max(...Object.values(s),1);let title=combo?combo.replace(/\b\w/g,c=>c.toUpperCase()):groups[key].title;let a=actions[key];let scoreHtml='<div class="score">'+Object.entries(groups).map(([k,g])=>`<div class="scoreRow"><span>${g.title}</span><div class="bar"><div class="fill" style="width:${(s[k]/max)*100}%"></div></div><span>${s[k]}</span></div>`).join('')+'</div>';let comboNote=combo?`<p class="muted">Combination pattern detected: <b>${combo}</b>. Treat strength and extraction separately rather than changing everything at once.</p>`:'';diag.innerHTML=`<h2>${title}</h2><div>${selected.map(x=>`<span class="pill">${x.word}</span>`).join('')}</div>${comboNote}${scoreHtml}<div class="fix"><b>General correction</b>${a.generic.join('<br>')}</div><div class="fix"><b>${methods[m].name}</b>${a[m].join('<br>')}</div><p class="muted">Change one variable per brew. For Joepresso, prioritize grind, puck prep, moderate tamp pressure, dose, and dilution. For Switch, prioritize ratio, steep time, grind, and agitation.</p>`}
function render(){renderTabs();renderChips();renderSelected();renderDiag()}search.oninput=renderChips;method.onchange=renderDiag;document.getElementById('clear').onclick=()=>{selected=[];render()};render();
</script>
</body>
</html>
